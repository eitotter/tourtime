<style>

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

  h2.sec{font-size:16px;margin:0}

  .pill.off{background:#7c2d12;color:#fed7aa}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;background:var(--panel);color:var(--muted)}
  .tab.on{background:var(--accent);color:#fff}
  .hidden{display:none!important}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .full{grid-column:1/-1}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  select,input{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid #475569;background:var(--bg);color:var(--text);min-height:44px;font-family:inherit}
  input{-webkit-appearance:none;appearance:none}
  .row{display:flex;gap:8px;margin-top:10px}
  .row>*{flex:1}
  button{font-size:15px;border:0;border-radius:10px;padding:10px 12px;background:#334155;color:#fff;min-height:44px;font-family:inherit}
  button:active{opacity:.6}
  button.primary{background:var(--accent)}
  button.danger{background:#7f1d1d}
  button:disabled{opacity:.4}
  .cards{display:grid;grid-template-columns:1fr;gap:12px}

  .card.base{background:#312e81;border-color:#818cf8}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
  .name{font-size:18px;font-weight:700}
  .country{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
  .tag{font-size:11px;background:var(--accent);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .actions{display:flex;gap:6px}
  .actions button{font-size:12px;min-height:32px;padding:6px 10px}
  .time{display:flex;align-items:baseline;gap:8px}
  .period{font-size:14px;color:#cbd5e1}
  .clock{font-size:40px;font-weight:700;font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
  .date{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:#cbd5e1;margin:4px 0 12px}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
  .b0{background:#475569}.bm{background:#2563eb}.bp{background:#ea580c}
  .diff{font-size:12px;color:var(--muted)}
  .wx{border-top:1px solid var(--border);padding-top:10px;min-height:56px}
  .wxrow{display:flex;align-items:center;gap:12px}
  .wxicon{font-size:34px}
  .temp{font-size:22px;font-weight:600}
  .wxtext{font-size:13px;color:#cbd5e1}
  .wxdetail{margin-left:auto;font-size:12px;color:var(--muted);line-height:1.6;text-align:right}
  .wxmeta{font-size:11px;color:#64748b;margin-top:6px}
  .note{font-size:13px;color:var(--muted)}
  .warn{color:#fbbf24}.err{color:#f87171}
  .stop{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
  .stophead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .wxboxes{display:flex;gap:8px;margin-top:10px}

  .wxtag{font-size:11px;color:var(--muted);margin-bottom:4px}

  .wxicon2{font-size:26px}
  .trip-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
  .tripcard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
  .tripcard:active{opacity:.6}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btnrow>*{flex:1}
  footer{font-size:11px;color:#64748b;margin-top:18px;line-height:1.6}
</style>

<div class="wrap">
  <header>
    <h1>🦦 TourTime</h1>
    <span id="status" class="pill">● 線上</span>
  </header>

  <nav class="tabs">
    <button class="tab on" data-tab="cities">🌍 城市</button>
    <button class="tab" data-tab="trip">🧳 差旅</button>
  </nav>

  <!-- 城市分頁 -->
  <div id="tab-cities">

      <div class="grid">
        <div class="full">
          <label>基準城市</label>
          <select id="baseSel"></select>
        </div>
        <div>
          <label id="dateLbl">日期</label>
          <input type="date" id="date">
        </div>
        <div>
          <label id="timeLbl">時間</label>
          <input type="time" id="time">
        </div>
      </div>
      <div class="row">
        <button id="minus">−1h</button>
        <button id="plus">+1h</button>
        <button id="now">🕐 現在</button>
        <button id="refresh">↻ 天氣</button>
      </div>
      <div class="row">
        <select id="addSel" style="flex:3"></select>
        <button id="addBtn" class="primary" disabled>＋ 加入</button>
      </div>
    </section>
    <main id="cards" class="cards"></main>
  </div>

  <!-- 差旅分頁（列表／詳情／編輯 由程式動態產生） -->
  <div id="tab-trip" class="hidden">
    <div id="tripView"></div>
  </div>

  <footer>
    天氣資料：Open-Meteo（每小時預報，約 16 天內）。離線時顯示上次儲存的預報。<br>
    差旅每日天氣依各城市當地日期統計（最低／最高溫、最大降雨機率）。<br>
    時區與夏令時間由裝置內建時區資料計算，離線也能使用。
  </footer>
</div>

const CITIES = RAW.map(r => ({ id:r[0], name:r[1], country:r[2], region:r[3], tz:r[4], lat:r[5], lon:r[6] }));
const REGIONS = ['亞洲','中東','大洋洲','歐洲','美洲'];

CITIES.forEach(c => { if (!COUNTRIES.find(x => x.name === c.country)) COUNTRIES.push({ name:c.country, region:c.region }); });

const $ = (s) => document.querySelector(s);
const byId = (id) => CITIES.find(c => c.id === id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---------- 本機儲存 ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let state = LS.get('wt_state', null) || { baseId:'taipei', selected:['losangeles','tokyo','london','newyork'] };

const saveTrips = () => LS.set('wt_trips', trips);
// 差旅頁狀態：list ／ detail（已儲存或預覽）／ edit（新增或編輯草稿）
let view = { mode:'list' };

const saveWeather = () => LS.set('wt_weather', weather);
const loading = {}, errors = {};

// ---------- 時區工具 ----------
function getOffsetMs(tz, date) {
  const dtf = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const p = {};
  dtf.formatToParts(date).forEach(x => { p[x.type] = x.value; });
  const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  return asUtc - (date.getTime() - date.getMilliseconds());
}
function zonedToUtc(dateStr, timeStr, tz) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [h, mi] = timeStr.split(':').map(Number);
  const guess = Date.UTC(y, m - 1, d, h, mi);
  const off1 = getOffsetMs(tz, new Date(guess));
  let utc = guess - off1;
  const off2 = getOffsetMs(tz, new Date(utc));
  if (off2 !== off1) utc = guess - off2;
  return new Date(utc);
}
const dateKey = (tz, d) => new Intl.DateTimeFormat('en-CA', { timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit' }).format(d);
const timeStrIn = (tz, d) => new Intl.DateTimeFormat('en-GB', { timeZone:tz, hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).format(d).replace(/^24/, '00');
const dateLabel = (tz, d) => new Intl.DateTimeFormat('zh-TW', { timeZone:tz, year:'numeric', month:'long', day:'numeric', weekday:'short' }).format(d);
function offsetLabel(ms) {
  const mins = Math.round(ms / 60000), a = Math.abs(mins), h = Math.floor(a / 60), m = a % 60;
  return `UTC${mins >= 0 ? '+' : '-'}${h}${m ? ':' + String(m).padStart(2, '0') : ''}`;
}
function isDST(tz, date) {
  const y = date.getUTCFullYear();
  const jan = getOffsetMs(tz, new Date(Date.UTC(y, 0, 1)));
  const jul = getOffsetMs(tz, new Date(Date.UTC(y, 6, 1)));
  if (jan === jul) return null;
  return getOffsetMs(tz, date) === Math.max(jan, jul);
}
const periodLabel = (h) => h < 5 ? '凌晨' : h < 11 ? '早上' : h < 13 ? '中午' : h < 18 ? '下午' : '晚上';
function weatherInfo(c) {
  if (c === 0) return ['☀️','晴朗']; if (c === 1) return ['🌤️','大致晴']; if (c === 2) return ['⛅','多雲']; if (c === 3) return ['☁️','陰天'];
  if (c === 45 || c === 48) return ['🌫️','霧']; if (c >= 51 && c <= 57) return ['🌦️','毛毛雨']; if (c >= 61 && c <= 67) return ['🌧️','下雨'];
  if (c >= 71 && c <= 77) return ['❄️','下雪']; if (c >= 80 && c <= 82) return ['🌦️','陣雨']; if (c === 85 || c === 86) return ['🌨️','陣雪'];
  if (c >= 95) return ['⛈️','雷雨']; return ['❔','未知'];
}
function fmtAgo(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return '剛剛'; if (m < 60) return `${m} 分鐘前`;
  const h = Math.round(m / 60); if (h < 24) return `${h} 小時前`;
  return `${Math.round(h / 24)} 天前`;
}
// 日期（YYYY-MM-DD）工具

// UTF-8 安全的 Base64URL（用於分享連結）
function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64dec(str) {
  let s = str.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

// ---------- 天氣（逐時資料，離線可用） ----------
function cityIdsNeeded() {

}
async function fetchWeather(city, force) {
  if (!city || !navigator.onLine || loading[city.id]) return;
  const c = weather[city.id];
  if (!force && c && Date.now() - c.fetchedAt < 3600000) return;

  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}` +
      `&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=GMT&past_days=1&forecast_days=16`;
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('bad');
    const h = (await r.json()).hourly;
    weather[city.id] = { fetchedAt: Date.now(), time: h.time, temp: h.temperature_2m, rh: h.relative_humidity_2m, pop: h.precipitation_probability, code: h.weather_code, wind: h.wind_speed_10m };
    saveWeather();
  } catch (e) { errors[city.id] = true; }
  finally { clearTimeout(timer); loading[city.id] = false; render(); renderResults(); }
}
const fetchAll = (force) => cityIdsNeeded().forEach(id => fetchWeather(byId(id), force));

function dayStats(city, ymd) {
  const w = weather[city.id]; if (!w) return null;
  let tmax = -Infinity, tmin = Infinity, pop = 0, code = null, n = 0;
  w.time.forEach((t, i) => {
    const local = new Date(Date.parse(t + ':00Z'));
    if (dateKey(city.tz, local) !== ymd) return;
    n++;
    tmax = Math.max(tmax, w.temp[i]); tmin = Math.min(tmin, w.temp[i]);
    if (w.pop && w.pop[i] != null) pop = Math.max(pop, w.pop[i]);
    if (code === null || timeStrIn(city.tz, local) === '12:00') code = w.code[i];
  });
  return n ? { tmax, tmin, pop, code } : null;
}
function dayWxHtml(city, ymd) {
  const w = weather[city.id];
  if (!w) return loading[city.id] ? '<div class="note">載入中…</div>' : '<div class="note">尚無資料</div>';
  const s = dayStats(city, ymd);
  if (!s) return '<div class="note warn">超出預報範圍</div>';
  const [icon, text] = weatherInfo(s.code);
  return `<div class="wxrow2"><span class="wxicon2">${icon}</span><div>
    <div><b>${Math.round(s.tmin)}–${Math.round(s.tmax)}°C</b></div>
    <div class="wxtext">${text}・☂️ ${s.pop}%</div></div></div>`;
}
function renderWeather(city, utc) {
  const w = weather[city.id];
  const offline = !navigator.onLine;
  if (!w) {
    if (loading[city.id]) return '<div class="note">天氣載入中…</div>';
    if (offline) return '<div class="note warn">離線中・尚無此城市的天氣資料</div>';
    if (errors[city.id]) return '<div class="note err">天氣讀取失敗，請稍後按「↻ 天氣」</div>';
    return '<div class="note">—</div>';
  }
  const meta = `<div class="wxmeta">${loading[city.id] ? '更新中…' : '更新於 ' + fmtAgo(w.fetchedAt)}${offline ? '（離線，顯示上次資料）' : ''}${errors[city.id] ? '（更新失敗）' : ''}</div>`;
  const key = new Date(Math.round(utc.getTime() / 3600000) * 3600000).toISOString().slice(0, 13) + ':00';
  const i = w.time.indexOf(key);
  if (i < 0) return '<div class="note warn">超出預報範圍（約 16 天內）</div>' + meta;
  const [icon, text] = weatherInfo(w.code[i]);
  const pop = w.pop && w.pop[i] != null ? w.pop[i] : '-';
  return `<div class="wxrow"><div class="wxicon">${icon}</div>
    <div><div class="temp">${Math.round(w.temp[i])}°C</div><div class="wxtext">${text}</div></div>
    <div class="wxdetail">☂️ 降雨 ${pop}%<br>💧 濕度 ${w.rh[i]}%<br>💨 風速 ${Math.round(w.wind[i])} km/h</div></div>` + meta;
}

function setFromUtc(u) {

function optionsHtml(list, placeholder) {

function card(id, isBase, utc, baseKey, baseOff) {
  const c = byId(id), off = getOffsetMs(c.tz, utc), k = dateKey(c.tz, utc);
  const dayDiff = diffDays(baseKey, k);
  const hourDiff = (off - baseOff) / 3600000;
  const t = timeStrIn(c.tz, utc), h = parseInt(t.slice(0, 2), 10), dst = isDST(c.tz, utc);
  const badge = dayDiff === 0 ? ['同一天','b0'] : dayDiff < 0 ? [`前 ${-dayDiff} 天`,'bm'] : [`後 ${dayDiff} 天`,'bp'];
  return `<div class="card ${isBase ? 'base' : ''}">
    <div class="top">
      <div>
        <div class="name">📍 ${esc(c.name)}<span class="country">${esc(c.country)}</span>${isBase ? '<span class="tag">基準</span>' : ''}</div>
        <div class="sub">${offsetLabel(off)}${dst === null ? '' : dst ? '　☀️ 夏令時間' : '　❄️ 冬令時間'}</div>
      </div>
      ${isBase ? '' : `<div class="actions"><button data-act="base" data-id="${id}">設為基準</button><button data-act="del" data-id="${id}">✕</button></div>`}
    </div>
    <div class="time"><span class="period">${periodLabel(h)}</span><span class="clock">${t}</span></div>
    <div class="date">${dateLabel(c.tz, utc)}
      ${isBase ? '' : `<span class="badge ${badge[1]}">${badge[0]}</span><span class="diff">${hourDiff === 0 ? '無時差' : `比${base().name}${hourDiff > 0 ? '快' : '慢'} ${Math.abs(hourDiff)} 小時`}</span>`}
    </div>
    <div class="wx">${renderWeather(c, utc)}</div>
  </div>`;
}
function render() {
  const utc = currentUtc(), b = base();
  const baseKey = dateKey(b.tz, utc), baseOff = getOffsetMs(b.tz, utc);
  $('#cards').innerHTML = card(state.baseId, true, utc, baseKey, baseOff) + state.selected.map(id => card(id, false, utc, baseKey, baseOff)).join('');

}
function makeBase(id) {

}

$('#time').addEventListener('change', e => { if (e.target.value) { timeStr = e.target.value; render(); } });
$('#minus').addEventListener('click', () => { setFromUtc(new Date(currentUtc().getTime() - 3600000)); render(); });
$('#plus').addEventListener('click', () => { setFromUtc(new Date(currentUtc().getTime() + 3600000)); render(); });

// ================= 差旅：共用工具 =================
function tripRange(t) {
  if (!t.stops.length) return '尚無站點';
  const a = t.stops.map(s => s.arrive).sort(), d = t.stops.map(s => s.depart).sort();
  const nights = Math.max(0, diffDays(a[0], d[d.length - 1]));
  return `${fmtDay(a[0])} → ${fmtDay(d[d.length - 1])}　・${t.stops.length} 站・共 ${nights} 晚`;
}
function countryOptions(sel) {

}
function cityOptions(country, sel) {
  return CITIES.filter(c => c.country === country).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
}

// 每站的即時時間與天氣
function resultCard(s, i, now, baseOff) {
  const c = byId(s.cityId); if (!c) return '';
  const b = base();
  const off = getOffsetMs(c.tz, now);
  const hourDiff = (off - baseOff) / 3600000;
  const today = dateKey(c.tz, now);
  const status = today < s.arrive ? ['尚未抵達','b0'] : today > s.depart ? ['已離開','b0'] : ['進行中','bp'];
  const dst = isDST(c.tz, now);
  const nights = Math.max(0, diffDays(s.arrive, s.depart));
  const clock = timeStrIn(c.tz, now);
  return `<div class="card ${status[0] === '進行中' ? 'base' : ''}">
    <div class="top">
      <div>
        <div class="name">${i + 1}. 📍 ${esc(c.name)}<span class="country">${esc(c.country)}</span></div>
        <div class="sub">${offsetLabel(off)}${dst === null ? '' : dst ? '　☀️ 夏令' : '　❄️ 冬令'}　${hourDiff === 0 ? '與基準同時區' : `比${b.name}${hourDiff > 0 ? '快' : '慢'} ${Math.abs(hourDiff)} 小時`}</div>
      </div>
      <span class="badge ${status[1]}">${status[0]}</span>
    </div>
    <div class="time"><span class="period">${periodLabel(parseInt(clock, 10))}</span><span class="clock">${clock}</span></div>
    <div class="date">當地現在：${dateLabel(c.tz, now)}</div>
    <div class="sub" style="margin-bottom:4px">${fmtDay(s.arrive)} → ${fmtDay(s.depart)}　共 ${nights} 晚</div>
    <div class="wxboxes">
      <div class="wxbox"><div class="wxtag">抵達日 ${fmtShort(s.arrive)}</div>${dayWxHtml(c, s.arrive)}</div>
      <div class="wxbox"><div class="wxtag">離開日 ${fmtShort(s.depart)}</div>${dayWxHtml(c, s.depart)}</div>
    </div>
  </div>`;
}
function resultsHtml(t) {
  if (!t.stops.length) return '<div class="note">這個行程還沒有站點。</div>';
  const now = new Date();
  const baseOff = getOffsetMs(base().tz, now);
  return t.stops.map((s, i) => resultCard(s, i, now, baseOff)).join('');
}
function renderResults() {
  const box = $('#results');
  const t = curTrip();
  if (box && t) box.innerHTML = resultsHtml(t);
}

function startEdit(t) {

  const arrive = last ? last.depart : dateKey(base().tz, new Date());
  const cityId = last ? last.cityId : state.baseId;

function saveDraft() {

  if (!d.stops.length) return alert('請至少新增一個站點');
  if (d.stops.some(s => s.depart < s.arrive)) return alert('有站點的離開日期早於抵達日期');
  const t = { id: d.id, name: d.name.trim(), stops: d.stops, saved: true, updatedAt: Date.now() };

// ---------- 分享：複製可開啟的連結 ----------
let toastTimer;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:#f1f5f9;color:#0f172a;padding:10px 16px;border-radius:999px;font-size:14px;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:opacity .3s;opacity:0;pointer-events:none;max-width:90%;text-align:center';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}
// 傳統複製方式（備用）
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
async function shareTrip(t) {
  if (!t) return;
  // 目前頁面的正式網址（去掉 # 與 ?）
  const pageUrl = location.href.split('#')[0].split('?')[0];
  if (!/^https?:\/\//.test(pageUrl)) {
    alert('目前是預覽環境，無法產生可分享的連結。\n\n請先把 TourTime 上傳到 GitHub Pages 或 Netlify（https 網址）後，從該網址開啟再分享。');
    return;
  }
  const payload = { v: 1, n: t.name, s: t.stops.map(s => [s.cityId, s.arrive, s.depart]) };
  const link = pageUrl + '#trip=' + b64enc(JSON.stringify(payload));
  const text = `🧳 ${t.name}\n${link}`;
  const ok = await copyText(text);
  if (ok) {
    toast('✅ 已複製行程連結');
  } else {
    toast('複製失敗，請長按下方視窗的連結');
    prompt('請長按複製以下內容：', text);
  }
}

// 解析分享內容：可接受完整連結、含連結的文字，或純代碼
function parseShareText(text) {
  const m = text.match(/#trip=([A-Za-z0-9\-_]+)/);
  const code = m ? m[1] : text.trim();
  const p = JSON.parse(b64dec(code));
  if (!p || !Array.isArray(p.s)) throw new Error('格式不符');
  const stops = p.s
    .map(([cityId, arrive, depart]) => ({ id: uid(), cityId, arrive, depart }))
    .filter(s => byId(s.cityId));
  if (!stops.length) throw new Error('沒有有效的城市站點');
  return { id: uid(), name: p.n || '分享的行程', stops };
}

// 手動貼上匯入：開啟預覽畫面
function openPasteImport() {
  const text = prompt('請貼上對方分享的連結或文字：');
  if (!text) return;
  try {
    view = { mode: 'detail', id: null, temp: parseShareText(text) };
  } catch (e) {
    alert('無法解析此內容：' + e.message);
  }
}

// 接收分享：開啟連結時解析並以預覽顯示
function importFromHash() {
  const m = location.hash.match(/^#trip=(.+)$/); if (!m) return false;
  try {
    const p = JSON.parse(b64dec(m[1]));
    const stops = p.s.map(([cityId, arrive, depart]) => ({ id: uid(), cityId, arrive, depart })).filter(s => byId(s.cityId));
    history.replaceState(null, '', location.pathname + location.search);
    view = { mode:'detail', id: null, temp: { id: uid(), name: p.n || '分享的行程', stops } };
    return true;
  } catch (e) {
    alert('分享連結無法解析');
    history.replaceState(null, '', location.pathname + location.search);
    return false;
  }
}
function importSave() {
  const t = view.temp;
  const nt = { id: uid(), name: t.name, stops: t.stops, saved: true, updatedAt: Date.now() };
  trips.push(nt); saveTrips();
  view = { mode:'detail', id: nt.id };
}

// ---------- 事件委派 ----------
$('#tripView').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, i = +el.dataset.idx;
  const d = view.draft;
  switch (act) {
    case 'importPaste': openPasteImport(); break;
    case 'new': startEdit(null); break;
    case 'open': view = { mode:'detail', id: el.dataset.id }; break;
    case 'back': view = { mode:'list' }; break;
    case 'edit': { const t = trips.find(x => x.id === view.id); if (t) startEdit(t); break; }
    case 'share': shareTrip(curTrip()); break;
    case 'delete': deleteTrip(); break;
    case 'importSave': importSave(); break;
    case 'save': saveDraft(); break;
    case 'cancel': cancelEdit(); break;
    case 'addStop': addStop(); break;
    case 'up': if (d && i > 0) [d.stops[i - 1], d.stops[i]] = [d.stops[i], d.stops[i - 1]]; break;
    case 'down': if (d && i < d.stops.length - 1) [d.stops[i + 1], d.stops[i]] = [d.stops[i], d.stops[i + 1]]; break;
    case 'sdel': if (d && confirm('刪除這個站點？')) d.stops.splice(i, 1); break;
  }
  renderTrip();
});
$('#tripView').addEventListener('input', e => {
  if (view.mode === 'edit' && e.target.dataset.field === 'name') view.draft.name = e.target.value;
});
$('#tripView').addEventListener('change', e => {
  if (view.mode !== 'edit') return;
  const el = e.target, f = el.dataset.field;
  if (f === 'name') { view.draft.name = el.value; return; }
  if (el.dataset.idx === undefined) return;
  const s = view.draft.stops[+el.dataset.idx]; if (!s) return;
  if (f === 'country') { const first = CITIES.find(c => c.country === el.value); if (first) s.cityId = first.id; }
  else if (f === 'cityId') s.cityId = el.value;
  else if (f === 'arrive' || f === 'depart') { if (!el.value) return; s[f] = el.value; }
  renderTrip();
});

// 分頁切換
function activateTab(tab) {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  $('#tab-cities').classList.toggle('hidden', tab !== 'cities');
  $('#tab-trip').classList.toggle('hidden', tab !== 'trip');
  if (tab === 'trip') renderTrip();
}
document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => activateTab(btn.dataset.tab)));

// 狀態事件
window.addEventListener('online', () => { render(); renderResults(); fetchAll(false); });
window.addEventListener('offline', () => { render(); renderResults(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); renderResults(); fetchAll(false); } });
setInterval(() => { if (view.mode === 'detail') renderResults(); }, 30000);

// ---------- 啟動 ----------
setFromUtc(new Date());
renderSelects(); render();
const imported = importFromHash();
activateTab(imported ? 'trip' : 'cities');
if (!imported) renderTrip();
fetchAll(false);
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
